<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnonGate</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07111f;
        color: #f7f9fc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #07111f 0%, #11233d 100%);
        display: grid;
        place-items: center;
      }
      main {
        width: min(92vw, 760px);
        padding: 2rem;
        border-radius: 24px;
        background: rgba(8, 16, 32, 0.9);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      h1 { margin-top: 0; }
      .card { margin-top: 1rem; padding: 1rem; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; }
      label { display: block; font-weight: 600; margin-bottom: .4rem; }
      input { width: 100%; padding: .8rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: #091524; color: #fff; }
      button { margin-top: 1rem; padding: .8rem 1rem; border-radius: 999px; border: none; cursor: pointer; background: linear-gradient(90deg, #7c7cff, #45c9ff); color: white; font-weight: 700; }
      .pill { display: inline-block; padding: .3rem .6rem; border-radius: 999px; background: rgba(69, 201, 255, .2); color: #95e6ff; margin-bottom: .7rem; }
      .muted { color: #9fb3c8; }
      .status { margin-top: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div class="pill">Private allowlist access</div>
      <h1>AnonGate</h1>
      <p class="muted">This demo lets you join a privacy-preserving allowlist. Your secret stays private and is never shown publicly on-chain.</p>
      <section class="card">
        <label for="secretCode">Enter your private join code</label>
        <input id="secretCode" type="password" autocomplete="off" placeholder="Example: alpha-123" />
        <button id="joinButton" type="button">Join allowlist</button>
        <div id="status" class="status">Waiting for your code.</div>
      </section>
    </main>
    <script type="module" src="/src/frontend/main.ts"></script>
  </body>
</html>
